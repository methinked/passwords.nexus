<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <filter id="neon-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <linearGradient id="purpleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e291ff"/>
      <stop offset="100%" stop-color="#c45cff"/>
    </linearGradient>
  </defs>

  <!-- Background slate plate -->
  <rect x="24" y="24" width="464" height="464" rx="104" fill="#12151c" stroke="#c45cff" stroke-width="10" stroke-opacity="0.55"/>
  <rect x="40" y="40" width="432" height="432" rx="90" fill="none" stroke="#c45cff" stroke-width="3" stroke-opacity="0.18"/>

  <!-- Torii Gate -->
  <g filter="url(#neon-glow)" fill="url(#purpleGrad)">
    <!-- Top curved Kasagi -->
    <path d="M 70 136 Q 256 160 442 136 C 445 142 445 148 442 154 Q 256 178 70 154 C 67 148 67 142 70 136 Z"/>

    <!-- Secondary lintel (Shimaki) -->
    <rect x="104" y="174" width="304" height="24" rx="5"/>

    <!-- Central strut (Gakuzuka) -->
    <rect x="244" y="184" width="24" height="52" rx="3"/>

    <!-- Lower crossbeam (Nuki) -->
    <rect x="120" y="234" width="272" height="22" rx="4"/>

    <!-- Left Pillar (Hashira) -->
    <polygon points="156,174 182,174 171,416 145,416"/>

    <!-- Right Pillar (Hashira) -->
    <polygon points="330,174 356,174 367,416 341,416"/>

    <!-- Pillar base pedestals (Daiishi) -->
    <rect x="137" y="412" width="42" height="18" rx="4"/>
    <rect x="333" y="412" width="42" height="18" rx="4"/>
  </g>
</svg>
